<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OMEGA AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#020617;
    overflow:hidden;
    color:white;
}

/* Animated Background */
.background{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(0,255,255,0.08);
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100vh);
    }
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:900px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(0,255,255,0.2);
    backdrop-filter:blur(20px);
    border-radius:30px;
    padding:50px;
    text-align:center;
    box-shadow:0 0 50px rgba(0,255,255,0.15);
}

.logo{
    width:180px;
    height:180px;
    border:4px solid cyan;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:spin 8s linear infinite;
    box-shadow:0 0 40px cyan;
}

.logo span{
    font-size:70px;
    color:cyan;
    text-shadow:0 0 20px cyan;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

h1{
    margin-top:30px;
    font-size:60px;
    color:cyan;
    text-shadow:0 0 20px cyan;
}

p{
    margin-top:15px;
    color:#b6c5d6;
    font-size:20px;
}

.buttons{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

button{
    border:none;
    padding:18px 35px;
    border-radius:20px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.activate{
    background:cyan;
    color:black;
    box-shadow:0 0 30px cyan;
}

.activate:hover{
    transform:scale(1.1);
}

.voice{
    background:transparent;
    border:2px solid cyan;
    color:cyan;
}

.voice:hover{
    background:cyan;
    color:black;
}

.wave{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:30px;
    height:60px;
}

.bar{
    width:8px;
    background:cyan;
    border-radius:20px;
    animation:wave 1s infinite ease-in-out;
}

.bar:nth-child(1){height:20px;}
.bar:nth-child(2){height:30px; animation-delay:.2s;}
.bar:nth-child(3){height:50px; animation-delay:.3s;}
.bar:nth-child(4){height:30px; animation-delay:.4s;}
.bar:nth-child(5){height:20px; animation-delay:.5s;}

@keyframes wave{
    0%,100%{
        transform:scaleY(1);
    }
    50%{
        transform:scaleY(1.8);
    }
}

.status{
    margin-top:30px;
    font-size:20px;
    color:#00ff88;
    text-shadow:0 0 15px #00ff88;
}

.footer{
    margin-top:30px;
    color:#7f8fa6;
    font-size:14px;
}
</style>
</head>

<body>

<div class="background" id="background"></div>

<div class="container">
    <div class="card">

        <div class="logo">
            <span>Ω</span>
        </div>

        <h1>OMEGA AI</h1>

        <p>
            Autonomous AGI Assistant • Jarvis Style Interface
        </p>

        <div class="wave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="buttons">
            <button class="activate" onclick="activateOmega()">
                Activate Omega
            </button>

            <button class="voice" onclick="voiceMode()">
                Voice Mode
            </button>
        </div>

        <div class="status" id="status">
            STATUS : STANDBY
        </div>

        <div class="footer">
            Powered By OMEGA Autonomous AGI
        </div>

    </div>
</div>

<script>
// Animated circles background
const background = document.getElementById("background");

for(let i=0;i<40;i++){
    const circle = document.createElement("div");
    circle.classList.add("circle");

    let size = Math.random()*100+20;

    circle.style.width = size+"px";
    circle.style.height = size+"px";
    circle.style.left = Math.random()*100+"%";
    circle.style.animationDuration =
    (Math.random()*10+5)+"s";

    background.appendChild(circle);
}

// Activate Button
function activateOmega(){
    document.getElementById("status").innerHTML =
    "STATUS : OMEGA ACTIVATED";

    alert("OMEGA AI ACTIVATED");
}

// Voice Mode
function voiceMode(){

    const speech = new SpeechSynthesisUtterance(
        "Hello Sir, Omega AI is online."
    );

    speech.rate = 1;
    speech.pitch = 1;
    speech.volume = 1;

    speechSynthesis.speak(speech);
}
</script>

</body>
</html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA AI</title>

    <link rel="stylesheet" href="style.css">
</head>
